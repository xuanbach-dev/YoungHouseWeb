version: '3.8'

services:
  # Web Application
  younghouse-web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_SERVER=${DB_SERVER}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - younghouse-network

  # SQL Server Database (Optional - nếu chưa có database server riêng)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
      - ./backend/scripts:/scripts
    restart: unless-stopped
    networks:
      - younghouse-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - younghouse-web
    restart: unless-stopped
    networks:
      - younghouse-network

volumes:
  db_data:

networks:
  younghouse-network:
    driver: bridge